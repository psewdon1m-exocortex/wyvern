name: Signed Wyvern release
on:
  push:
    tags: ['wyvern-v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: wyvern-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - name: Require successful producers on the exact protected source
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ vars.WYVERN_CANDIDATE_RUN_ID }}
          QUALIFICATION_RUN_ID: ${{ vars.WYVERN_QUALIFICATION_RUN_ID }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "wyvern-v$(node -p "require('./package.json').version")"
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 scripts/verify-run.py candidate "$CANDIDATE_RUN_ID"
          python3 scripts/verify-run.py qualification "$QUALIFICATION_RUN_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wyvern-candidate-${{ github.sha }}
          run-id: ${{ vars.WYVERN_CANDIDATE_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wyvern-qualification-${{ github.sha }}
          run-id: ${{ vars.WYVERN_QUALIFICATION_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/qualified/qualification
      - name: Verify candidate, current policy and exact artifact evidence
        run: python3 scripts/verify-qualification.py --assets "$RUNNER_TEMP/qualified/assets" --bundle "$RUNNER_TEMP/qualified/qualification" --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify trusted image provenance and SBOM before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/qualified/assets"
          image="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$assets/candidate.json")"
          gh attestation verify "oci://$image" --bundle "$assets/image-provenance.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          gh attestation verify "oci://$image" --bundle "$assets/image-sbom-attestation.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/candidate.yml" --source-digest "$GITHUB_SHA" --predicate-type https://spdx.dev/Document --deny-self-hosted-runners
          docker pull "$image"
          node scripts/smoke-container.mjs "$image"
          docker save "$image" -o "$RUNNER_TEMP/image.tar"
          python3 scripts/security-scan.py --assets "$RUNNER_TEMP/qualified" --image-archive "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/scan" "$(cat .release/trivy.image)" image --input /scan/image.tar --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress --format json --output /scan/image-scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wyvern-qualified-${{ github.sha }}
          path: ${{ runner.temp }}/qualified/
          if-no-files-found: error
          retention-days: 90
  sign:
    needs: qualify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wyvern-qualified-${{ github.sha }}
          path: ${{ runner.temp }}/qualified
      - name: Sign in a single process without publication permissions
        env:
          WYVERN_SIGNING_KEY: ${{ secrets.WYVERN_RELEASE_PRIVATE_KEY }}
        run: node scripts/sign-ephemeral.mjs "$RUNNER_TEMP/qualified/assets/wyvern-release.json" "$RUNNER_TEMP/qualified/assets/wyvern.pem"
      - name: Check signed outputs after the secret process has exited
        run: |
          python3 scripts/verify-signed.py "$RUNNER_TEMP/qualified/assets"
          python3 scripts/security-scan.py --assets "$RUNNER_TEMP/qualified"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wyvern-signed-${{ github.sha }}
          path: ${{ runner.temp }}/qualified/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wyvern-signed-${{ github.sha }}
          path: ${{ runner.temp }}/qualified
      - name: Verify, stage as prerelease, then promote only a complete qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify-signed.py "$RUNNER_TEMP/qualified/assets"
          python3 scripts/publish-release.py --assets "$RUNNER_TEMP/qualified/assets" --bundle "$RUNNER_TEMP/qualified/qualification" --public-key "$RUNNER_TEMP/qualified/assets/wyvern.pem" --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
